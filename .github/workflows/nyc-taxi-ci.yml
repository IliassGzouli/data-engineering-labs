name: NYC Taxi CI

on:
  push:
    branches:
      - main
      - "feature/**"
    paths:
      - "nyc-taxi-cloud-lakehouse/**"
      - ".github/workflows/nyc-taxi-ci.yml"

  pull_request:
    branches:
      - main
    paths:
      - "nyc-taxi-cloud-lakehouse/**"
      - ".github/workflows/nyc-taxi-ci.yml"

jobs:
  tests:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: nyc-taxi-cloud-lakehouse

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: |
          python -m pytest -v

  docker-build:
    runs-on: ubuntu-latest
    needs: tests

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build \
            -t nyc-taxi-pipeline:ci \
            ./nyc-taxi-cloud-lakehouse