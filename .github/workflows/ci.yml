name: Ecommerce Data CI

on:
  push:
    paths:
      - "ecommerce-dbt-analytics-warehouse/**"
      - ".github/workflows/ci.yml"

  pull_request:
    paths:
      - "ecommerce-dbt-analytics-warehouse/**"
      - ".github/workflows/ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ecommerce-dbt-analytics-warehouse

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: ecommerce-dbt-analytics-warehouse/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Python tests
        run: pytest

      - name: Generate Bronze CI data
        run: |
          python - <<'PY'
          from ingestion.pipeline import run_ingestion_pipeline

          run_ingestion_pipeline(
              raw_data_dir="tests/fixtures/ci_raw",
              bronze_data_dir="tests/fixtures/ci_bronze",
          )
          PY

      - name: Generate Silver CI data
        run: |
          python - <<'PY'
          from transformation.pipeline import (
              run_customers_silver_pipeline,
              run_orders_silver_pipeline,
              run_order_items_silver_pipeline,
              run_order_payments_silver_pipeline,
              run_products_silver_pipeline,
              run_sellers_silver_pipeline,
              run_order_reviews_silver_pipeline,
              run_product_category_translation_silver_pipeline,
              run_geolocation_silver_pipeline,
          )

          bronze = "tests/fixtures/ci_bronze"
          silver = "tests/fixtures/ci_silver"

          run_customers_silver_pipeline(
              f"{bronze}/olist_customers_dataset.parquet", silver
          )
          run_orders_silver_pipeline(
              f"{bronze}/olist_orders_dataset.parquet", silver
          )
          run_order_items_silver_pipeline(
              f"{bronze}/olist_order_items_dataset.parquet", silver
          )
          run_order_payments_silver_pipeline(
              f"{bronze}/olist_order_payments_dataset.parquet", silver
          )
          run_products_silver_pipeline(
              f"{bronze}/olist_products_dataset.parquet", silver
          )
          run_sellers_silver_pipeline(
              f"{bronze}/olist_sellers_dataset.parquet", silver
          )
          run_order_reviews_silver_pipeline(
              f"{bronze}/olist_order_reviews_dataset.parquet", silver
          )
          run_product_category_translation_silver_pipeline(
              f"{bronze}/product_category_name_translation.parquet", silver
          )
          run_geolocation_silver_pipeline(
              f"{bronze}/olist_geolocation_dataset.parquet", silver
          )
          PY

      - name: Run dbt build
        working-directory: ecommerce-dbt-analytics-warehouse/ecommerce_analytics
        run: |
          dbt build --vars '{"silver_data_path": "../tests/fixtures/ci_silver"}'

      - name: Build Docker image
        run: docker build -t ecommerce-dbt-analytics:ci .