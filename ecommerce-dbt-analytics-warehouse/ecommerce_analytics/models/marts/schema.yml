version: 2

models:
  - name: dim_customers
    description: "Dimension contenant les informations principales des clients."

    columns:
      - name: customer_id
        description: "Identifiant du client associé à une commande."
        tests:
          - not_null
          - unique

      - name: customer_unique_id
        description: "Identifiant unique permettant de reconnaître un même client à travers plusieurs commandes."
        tests:
          - not_null

      - name: customer_zip_code_prefix
        description: "Préfixe du code postal du client."

      - name: customer_city
        description: "Ville du client."

      - name: customer_state
        description: "État du client."


  - name: fct_orders
    description: "Table de faits contenant une ligne par commande avec les principales informations et mesures liées à la commande."

    columns:
      - name: order_id
        description: "Identifiant unique de la commande."
        tests:
          - not_null
          - unique

      - name: customer_id
        description: "Identifiant du client ayant passé la commande."
        tests:
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_id

      - name: order_status
        description: "Statut actuel de la commande."
        tests:
          - accepted_values:
              arguments:
                values:
                  - delivered
                  - shipped
                  - canceled
                  - unavailable
                  - invoiced
                  - processing
                  - created
                  - approved
      - name: order_purchase_timestamp
        description: "Date et heure auxquelles la commande a été passée."

      - name: order_approved_at
        description: "Date et heure d'approbation de la commande."

      - name: order_delivered_carrier_date
        description: "Date et heure auxquelles la commande a été remise au transporteur."

      - name: order_delivered_customer_date
        description: "Date et heure de livraison effective au client."

      - name: order_estimated_delivery_date
        description: "Date de livraison estimée pour la commande."

      - name: has_delivery_date_anomaly
        description: "Indique si une commande livrée présente une anomalie liée à une date de livraison manquante."

      - name: item_count
        description: "Nombre total d'articles présents dans la commande."

      - name: products_value
        description: "Valeur totale des produits de la commande, hors frais de livraison."

      - name: freight_value
        description: "Montant total des frais de livraison de la commande."

      - name: order_total_value
        description: "Valeur totale de la commande, incluant les produits et les frais de livraison."


  - name: fct_order_items
    description: "Table de faits contenant une ligne par article de commande avec les informations de prix et de livraison."

    columns:
      - name: order_id
        description: "Identifiant de la commande."
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('fct_orders')
                field: order_id

      - name: order_item_id
        description: "Numéro de l'article dans la commande."
        tests:
          - not_null

      - name: product_id
        description: "Identifiant du produit."
        tests:
          - relationships:
              arguments:
                to: ref('dim_products')
                field: product_id

      - name: seller_id
        description: "Identifiant du vendeur."
        tests:
          - relationships:
              arguments:
                to: ref('dim_sellers')
                field: seller_id

      - name: shipping_limit_date
        description: "Date limite d'expédition de l'article."

      - name: price
        description: "Prix de l'article."

      - name: freight_value
        description: "Montant des frais de livraison."

      - name: item_total_value
        description: "Valeur totale de l'article, calculée comme price + freight_value."


  - name: fct_payments
    description: "Table de faits contenant une ligne par paiement associé à une commande."

    columns:
      - name: order_id
        description: "Identifiant de la commande associée au paiement."
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('fct_orders')
                field: order_id

      - name: payment_sequential
        description: "Numéro séquentiel du paiement pour une même commande."
        tests:
          - not_null
      - name: payment_type
        description: "Type de moyen de paiement utilisé."

      - name: payment_installments
        description: "Nombre de versements associés au paiement."

      - name: payment_value
        description: "Montant du paiement."

      - name: has_invalid_payment_value
        description: "Indique si le montant du paiement est considéré comme invalide."

      - name: has_undefined_payment_type
        description: "Indique si le type de paiement est non défini."


  - name: dim_products
    description: "Dimension contenant les informations descriptives et physiques des produits."

    columns:
      - name: product_id
        description: "Identifiant unique du produit."
        tests:
          - not_null
          - unique

      - name: product_category_name
        description: "Catégorie du produit."

      - name: product_category_name_english
        description: "Nom anglais de la catégorie du produit lorsque la traduction est disponible."

      - name: product_name_lenght
        description: "Longueur du nom du produit."

      - name: product_description_lenght
        description: "Longueur de la description du produit."

      - name: product_photos_qty
        description: "Nombre de photos associées au produit."

      - name: product_weight_g
        description: "Poids du produit en grammes."

      - name: product_length_cm
        description: "Longueur du produit en centimètres."

      - name: product_height_cm
        description: "Hauteur du produit en centimètres."

      - name: product_width_cm
        description: "Largeur du produit en centimètres."

      - name: has_missing_product_metadata
        description: "Indique si certaines métadonnées du produit sont manquantes."

      - name: has_invalid_product_dimensions
        description: "Indique si les dimensions physiques du produit sont invalides."


  - name: dim_sellers
    description: "Dimension contenant les informations principales des vendeurs."

    columns:
      - name: seller_id
        description: "Identifiant unique du vendeur."
        tests:
          - not_null
          - unique

      - name: seller_zip_code_prefix
        description: "Préfixe du code postal du vendeur."

      - name: seller_city
        description: "Ville du vendeur."

      - name: seller_state
        description: "État du vendeur."

  - name: fct_reviews
    description: "Table de faits contenant les avis clients associés aux commandes."

    columns:
      - name: review_id
        description: "Identifiant de l'avis client."

      - name: order_id
        description: "Identifiant de la commande associée à l'avis."
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('fct_orders')
                field: order_id

      - name: review_score
        description: "Note attribuée par le client à la commande."

      - name: review_comment_title
        description: "Titre du commentaire laissé par le client."

      - name: review_comment_message
        description: "Contenu du commentaire laissé par le client."

      - name: review_creation_date
        description: "Date de création de l'avis."

      - name: review_answer_timestamp
        description: "Date et heure de réponse à l'avis."

      - name: has_duplicate_review_id
        description: "Indique si l'identifiant de l'avis est présent plusieurs fois dans le dataset."

  - name: dim_geolocation
    description: "Dimension géographique contenant une ligne par préfixe de code postal avec des coordonnées moyennes et la ville et l'État les plus fréquents."

    columns:
      - name: geolocation_zip_code_prefix
        description: "Préfixe du code postal identifiant la zone géographique."
        tests:
          - not_null
          - unique

      - name: geolocation_lat
        description: "Latitude moyenne associée au préfixe du code postal."

      - name: geolocation_lng
        description: "Longitude moyenne associée au préfixe du code postal."

      - name: geolocation_city
        description: "Ville la plus fréquemment associée au préfixe du code postal."

      - name: geolocation_state
        description: "État le plus fréquemment associé au préfixe du code postal."